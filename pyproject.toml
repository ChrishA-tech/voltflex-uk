[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltflex-uk"
version = "0.1.0"
description = "Real-Time UK Grid Balancing, EV & Battery Dispatch Optimization, and NESO/Ofgem Flexibility Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pandera>=0.20.0",
    "duckdb>=1.1.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "mapie>=0.9.0",
    "torch>=2.3.0",
    "mlflow>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "rank-bm25>=0.2.2",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
